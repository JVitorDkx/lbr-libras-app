<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta
      name="description"
      content="LBRLibras — protótipo gamificado para ensino introdutório de Libras"
    />
    <style id="lbrlibras-vlibras-critical-css">
      [vw-access-button],
      .vp-access-button,
      .vp-pop-up,
      .vw-links {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <title>LBRLibras</title>
  </head>
  <body>
    <div id="root"></div>

    <div id="lbrlibras-vlibras-root" class="lbr-vlibras-widget-disabled">
      <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
          <div class="vw-plugin-top-wrapper"></div>
        </div>
      </div>
    </div>

    <script
      id="lbrlibras-vlibras-script"
      src="https://vlibras.gov.br/app/vlibras-plugin.js"
    ></script>
    <script>
      if (window.VLibras?.Widget) {
        window.__lbrlibrasVLibrasWidget = new window.VLibras.Widget(
          "https://vlibras.gov.br/app",
        );
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
